databases:
  - name: tuibydb
    plan: free
    databaseName: tuiby
    user: tuiby

services:
  - type: web
    plan: free
    name: tuiby
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn tuiby.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tuibydb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4